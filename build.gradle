buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'

group = mod_group_id
version = mod_version
archivesBaseName = mod_id

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation files('C:/Users/Ksivi/IdeaProjects/ESL - 1.16.5 Forge/build/libs/extraspeciallib-1.2.0+1.16.5-forge.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

processResources {
    filteringCharset = 'UTF-8'
    def replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,
                             esl_version_range   : esl_version_range]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    archiveFileName = "${mod_id}-${version}+${minecraft_version}-forge.jar"
    from('CHANGELOG.md') {
        into '.'
    }
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('copyToTestPacks') {
    dependsOn 'reobfJar'
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def packs = [
            file("${System.getProperty('user.home')}/curseforge/minecraft/Instances/C.Ideas/mods")
        ]
        packs.each { dest ->
            if (dest.exists()) {
                dest.listFiles({ f -> f.name.startsWith('extraspecialcore-') } as FileFilter)?.each { it.delete() }
                copy { from jarFile; into dest }
                println "Copied ${jarFile.name} to ${dest}"
            }
        }
    }
}

// copyToTestPacks stays available but is not part of build.
